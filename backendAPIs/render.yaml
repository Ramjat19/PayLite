services:
  - type: web
    name: paylite-api
    runtime: node
    rootDir: backendAPIs
    buildCommand: npm install && npm run prisma:generate && npm run prisma:migrate && npm run prisma:seed
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false